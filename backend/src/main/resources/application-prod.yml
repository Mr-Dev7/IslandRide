# ==============================================================================
# IslandRide — Production Profile Security & Runtime Configuration
# Profile: prod
# ==============================================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:islandride_db}?useSSL=true&requireSSL=true&verifyServerCertificate=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: IslandRideProdHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  # Production Redis Configuration (Ephemeral holds, distributed lock coordination & rate limiting)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

islandride:
  security:
    jwt:
      # Mandatory secret in production: strictly NO default fallback to prevent insecure deployments
      secret: ${JWT_SECRET}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cookie:
      name: ${REFRESH_COOKIE_NAME:__Host-refresh_token}
      secure: true
      same-site: Strict
      path: ${COOKIE_PATH:/}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    enabled: ${MAIL_ENABLED:true}
    host: ${MAIL_HOST:smtp.islandride.in}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@islandride.in}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:/var/lib/islandride/storage}
    max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:5242880}
    max-document-bytes: ${STORAGE_MAX_DOCUMENT_BYTES:5242880}
    max-images-per-vehicle: ${STORAGE_MAX_IMAGES_PER_VEHICLE:10}
    signing-secret: ${MEDIA_SIGNING_SECRET:${JWT_SECRET}}
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}
    upload-per-minute: ${RATELIMIT_UPLOAD_PER_MINUTE:60}
    catalog-search-per-minute: ${RATELIMIT_CATALOG_PER_MINUTE:300}
  payment:
    provider: ${ISLANDRIDE_PAYMENT_PROVIDER:${PAYMENT_GATEWAY_PROVIDER:razorpay}}
    live-enabled: ${ISLANDRIDE_PAYMENT_LIVE_ENABLED:${PAYMENT_LIVE_ENABLED:false}}
    order-expiry-minutes: ${ISLANDRIDE_PAYMENT_ORDER_EXPIRY_MINUTES:15}
    razorpay:
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
      key-id: ${ISLANDRIDE_PAYMENT_RAZORPAY_KEY_ID:${RAZORPAY_KEY_ID:}}
      key-secret: ${ISLANDRIDE_PAYMENT_RAZORPAY_KEY_SECRET:${RAZORPAY_KEY_SECRET:}}
      webhook-secret: ${ISLANDRIDE_PAYMENT_RAZORPAY_WEBHOOK_SECRET:${RAZORPAY_WEBHOOK_SECRET:}}
      connect-timeout-seconds: ${RAZORPAY_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${RAZORPAY_READ_TIMEOUT_SECONDS:15}

