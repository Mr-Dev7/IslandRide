# ==============================================================================
# IslandRide — Base Spring Boot Application Configuration
# ==============================================================================

spring:
  application:
    name: islandride-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Jackson JSON Serialization
  jackson:
    time-zone: UTC

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Actuator Telemetry & Probes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Custom Platform Business Settings Defaults (Configurable Proposals)
islandride:
  booking:
    hold-duration-seconds: ${HOLD_DURATION_SECONDS:600}
    default-turnaround-buffer-minutes: ${TURNAROUND_BUFFER_MINUTES:60}
    default-advance-percentage: ${ADVANCE_PERCENTAGE:25.0}
    default-commission-rate: ${COMMISSION_RATE:4.0}
    approval-deadline-hours-long: 6
    approval-deadline-hours-medium: 2
    approval-deadline-minutes-urgent: 45
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cookie:
      name: ${REFRESH_COOKIE_NAME:refresh_token}
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      path: ${COOKIE_PATH:/}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@islandride.in}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:./storage}
    max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:5242880}
    max-document-bytes: ${STORAGE_MAX_DOCUMENT_BYTES:5242880}
    max-images-per-vehicle: ${STORAGE_MAX_IMAGES_PER_VEHICLE:10}
    signing-secret: ${MEDIA_SIGNING_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}
    upload-per-minute: ${RATELIMIT_UPLOAD_PER_MINUTE:60}
    catalog-search-per-minute: ${RATELIMIT_CATALOG_PER_MINUTE:300}
  payment:
    provider: ${ISLANDRIDE_PAYMENT_PROVIDER:${PAYMENT_GATEWAY_PROVIDER:mock}}
    live-enabled: ${ISLANDRIDE_PAYMENT_LIVE_ENABLED:${PAYMENT_LIVE_ENABLED:false}}
    order-expiry-minutes: ${ISLANDRIDE_PAYMENT_ORDER_EXPIRY_MINUTES:15}
    razorpay:
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
      key-id: ${ISLANDRIDE_PAYMENT_RAZORPAY_KEY_ID:${RAZORPAY_KEY_ID:}}
      key-secret: ${ISLANDRIDE_PAYMENT_RAZORPAY_KEY_SECRET:${RAZORPAY_KEY_SECRET:}}
      webhook-secret: ${ISLANDRIDE_PAYMENT_RAZORPAY_WEBHOOK_SECRET:${RAZORPAY_WEBHOOK_SECRET:}}
      connect-timeout-seconds: ${RAZORPAY_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${RAZORPAY_READ_TIMEOUT_SECONDS:15}
    mock:
      key-secret: ${ISLANDRIDE_PAYMENT_MOCK_KEY_SECRET:mock-islandride-key-secret}
      webhook-secret: ${ISLANDRIDE_PAYMENT_MOCK_WEBHOOK_SECRET:mock-islandride-webhook-secret}



