# ==============================================================================
# IslandRide — Unit & Test Configuration Profile
# ==============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:islandride_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false # Disabled for lightweight unit tests; enabled for Testcontainers integration tests

  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    root: WARN
    com.islandride: INFO

