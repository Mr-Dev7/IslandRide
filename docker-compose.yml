services:
  # ============================================================================
  # MySQL 8.4 LTS Database (Transactional Storage & Durable Inventory Holds)
  # ============================================================================
  mysql:
    image: mysql:8.4
    container_name: islandride-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --explicit_defaults_for_timestamp=true
      --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-islandride_db}
      MYSQL_USER: ${MYSQL_USER:-islandride_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-islandride_password}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-${MYSQL_PORT:-3307}}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - islandride-network

  # ============================================================================
  # Redis 7.4 (In-Memory Key Expiry, Rate Limiting & Ephemeral Hold Coordination)
  # ============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: islandride-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - islandride-network

  # ============================================================================
  # Spring Boot Backend (Java 25 LTS REST API & Domain Engine)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: islandride-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      # MySQL Connection (Container internal network DNS)
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-islandride_db}
      MYSQL_USER: ${MYSQL_USER:-islandride_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-islandride_password}
      # Production profile compatibility mapping (DB_*)
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-islandride_db}
      DB_USERNAME: ${MYSQL_USER:-islandride_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-islandride_password}
      # Redis Connection (Container internal network DNS)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      # Storage Path (Mounted Volume)
      STORAGE_LOCAL_ROOT: /app/storage
      # Security & JWT Tokens
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4200,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:4200}
      # Payment Gateway Configuration
      ISLANDRIDE_PAYMENT_PROVIDER: ${ISLANDRIDE_PAYMENT_PROVIDER:-mock}
      ISLANDRIDE_PAYMENT_LIVE_ENABLED: ${ISLANDRIDE_PAYMENT_LIVE_ENABLED:-false}
      ISLANDRIDE_PAYMENT_ORDER_EXPIRY_MINUTES: ${ISLANDRIDE_PAYMENT_ORDER_EXPIRY_MINUTES:-15}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - storage-data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - islandride-network

  # ============================================================================
  # Angular Frontend (Nginx Reverse Proxy & Static SPA Serving)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: islandride-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - islandride-network

volumes:
  mysql-data:
    name: islandride-mysql-data
  redis-data:
    name: islandride-redis-data
  storage-data:
    name: islandride-storage-data

networks:
  islandride-network:
    name: islandride-network
    driver: bridge
